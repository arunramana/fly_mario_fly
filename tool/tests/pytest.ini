[pytest]
# Scoped to tool/tests/ only (pytest finds the nearest ini file walking up
# from the test paths given, so `pytest tool/tests/` picks this one up
# without affecting the repo's own `pytest tests/`, which sometimes
# legitimately takes several minutes per file under load). A hang here --
# like a modal QMessageBox with nothing to dismiss it in an automated run --
# fails after 180s instead of running for hours.
timeout = 180
