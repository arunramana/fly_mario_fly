[build-system]
requires = ["setuptools>=61,<70"]
build-backend = "setuptools.build_meta"

[project]
name = "fly_mario"
version = "0.0.1"
description = "Attach MaleCNS fly senses to Super Mario objects; watch, rewind, retry."
requires-python = ">=3.12"
# Same pins as the old repo: nes-py breaks under numpy 2.
dependencies = ["numpy>=1.26,<1.27", "pyyaml", "pyarrow",
    "fastapi>=0.150,<0.151", "uvicorn", "pydantic>=2", "httpx"]

[project.optional-dependencies]
dev = ["pytest"]
test = ["pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
fly_mario = ["fly/groups.yaml", "fly/data/*.yaml", "mario/facts/**/*.yaml"]
