# Super Mario Bros (NES) facts shared by every level. Source: the old code
# (env.py, level.py, knobs.py, senses_v2.py there), each value measured or read off RAM there.
# Per-level files in levels/ extend this one: lists are appended, maps are merged.

ram:                       # CPU RAM addresses (hex)
  mario_page: 0x006D       # Mario's x = page * 256 + mario_x
  mario_x: 0x0086
  mario_feet_y: 0x00CE     # feet y in tile-buffer coordinates (ground = 176, top of row 11)
  player_state: 0x001D     # 0 = on the ground (1 jumping, 2 falling, 3 climbing)
  facing: 0x0033           # 1 = right, 2 = left
  power: 0x0756            # 0 small, 1 big, 2 fire
  screen_page: 0x071A      # world x of the screen's left edge = page * 256 + x
  screen_x: 0x071C
  enemy_active: 0x000F     # + slot
  enemy_type: 0x0016
  enemy_state: 0x001E
  enemy_page: 0x006E
  enemy_x: 0x0087
  powerup_type: 0x0039     # which power-up the slot-5 object is: 0 mushroom, 1 fire flower, 2 star, 3 1-up (PowerUpType in the SMB disassembly)
  enemy_y: 0x00CF          # = the enemy's feet y + enemy_feet_offset
  jump_origin_y: 0x0708    # feet y where the current jump began (0 until the first jump); verified at take-off on 1-1
  tile_buffer: 0x0500      # 0x0500 + page_bytes * (page % 2) + 16 * row + col

grid:
  tile: 16                 # px per metatile
  page_bytes: 208          # 13 rows x 16 cols per buffer page
  ground_row: 11           # first ground row (rows 11 and 12 are ground)
  stand_row: 10            # the row directly above the ground, where a wall's base sits
  screen_w: 256            # visible width in px
  enemy_slots: 5           # slots 0-4 hold enemies; the power-up lives in slot 5
  powerup_slot: 5
  enemy_feet_offset: 8

mario:
  box_small: [12, 16]      # w, h
  box_big: [12, 24]        # big / fire (power >= 1); same feet reference as small
  power_names: [small, big, fire]
  jump_reach: 69           # px: a pit this wide or wider is flagged too_wide. Measured on 1-1 with the enemies off: a walking jump
                           # (right + A) travels 81 px in the air, minus his 12 px body = 69; a running jump (right + B + A) 144 - 12 = 132
  jump_apex: 68            # px a full walking jump rises above take-off (measured, old S2c)

tiles:                     # metatile ids
  empty: 0
  ground: 84
  pipe: [16, 17, 18, 19, 20, 21]   # 16/17 = the rim of 1-1 pipe 4; 18-21 = top-left/right, body-left/right
  step: [97]                       # hard (staircase) block
  brick: [81]
  coin: [194, 195]                 # 0xC2, 0xC3: the floating coin tiles (read in 4-3); they are in collision.not_solid
  qblock: [192, 193]               # unused ? block (192 coin, 193 mushroom)
  used_block: [196, 35]            # 196 used, 35 = the bump animation
  block_hit: 196                   # the used_block id that means a block was hit (35 is only the bump animation)
  ceiling_block: [84, 87, 88]      # solid from below, yet no brick/step/pipe/? block: the ceiling_block object
                                   # (old level.ceiling_tiles = pipe + step + brick + qblock + used_block + these)

collision:                 # the game's own "does this metatile stop Mario" rule, as data (pit.py / ram.is_solid read it)
  # A metatile id's top two bits pick one of 4 groups ("palettes") of 64 ids. The ROM keeps two 4-entry tables indexed by
  # that group: SolidMTileUpperExt at CPU $DF93 = 10 61 88 c4 and ClimbMTileUpperExt at $DF9B = 24 6d 8a c6
  # (read out of the bundled super-mario-bros.nes; $DF93/$DF9B are PRG addresses). The first is what the game's
  # solid-check compares against, but it is NOT the rule that stops Mario: poking every id 0-255 into the tile buffer
  # (as a wall across his path, and as a floor under his feet; tests/test_pits_tiles.py repeats this probe) showed that
  # an id stops him iff it is non-zero and below its group's ClimbMTileUpperExt entry, bar the exceptions listed.
  # (ids 36, 37 also hang the game when poked into the buffer; the probe skips them. They are above the extent anyway.)
  stop_upper_ext: [0x24, 0x6d, 0x8a, 0xc6]
  solid_upper_ext: [0x10, 0x61, 0x88, 0xc4]        # kept for the record; not used by the rule
  empty: 0
  not_solid: [95, 96, 194, 195]                    # measured exceptions: 0x5f, 0x60 and the two coin ids 0xc2, 0xc3

objects:                   # per-object facts; type bytes are the RAM object ids
  goomba:
    types: [0x06]
    size: [16, 16]
    live_states: [0, 1]    # 4 / 0x22 = stomped / defeated
  koopa:
    types: [0x00]
    size: [16, 24]
    live_states: [0]
    shell_states: [2, 3]   # in a shell: 16 x 16 (unverified on the emulator)
    shell_size: [16, 16]
  piranha:
    types: [0x0D]
    size: [16, 24]         # the part above its pipe's rim is all that exists
    live_states: [0]
  buzzy_beetle:            # type byte read on the emulator in 6-2 (also 4-2); state 0 while walking; a stomped beetle's shell is not tracked
    types: [0x02]
    size: [16, 16]
    live_states: [0, 1]
  red_koopa:               # the green Koopa is `koopa` (0x00); read in 3-3: states 0 and 1; its shell is not tracked
    types: [0x03]
    size: [16, 24]
    live_states: [0, 1]
  hammer_bro:              # read in 3-1: states 0 and 1, hops between ledges; the thrown hammers are not tracked
    types: [0x05]
    size: [16, 24]
    live_states: [0, 1]
  podoboo:                 # read in 2-4: state 0, leaps out of the lava (its box can be below the screen)
    types: [0x0C]
    size: [16, 16]
    live_states: [0]
  lift:
    types: [0x24, 0x25, 0x26, 0x27, 0x28, 0x29, 0x2A, 0x2B]   # platforms in the enemy slots (APPROXIMATE id range: balance, vertical, horizontal, falling)
    near_px: 48                                               # a lift within this many px of a pit counts as near
  non_enemy:               # slots in 0-4 that are not enemies: SMB keeps lifts and moving platforms in the enemy slots
    types: [0x24, 0x25, 0x26, 0x27, 0x28, 0x29, 0x2A, 0x2B, 0x2C]   # the platform ids of the level database (mario/leveldata PLATFORMS); scenes never switch these off
  mushroom:                # the power-up object (id 0x2E) in slot 5; PowerUpType picks which one it is
    types: [0x2E]
    size: [16, 16]
    powerup_types: [0]
  fire_flower:
    types: [0x2E]
    size: [16, 16]
    powerup_types: [1]
  star:
    types: [0x2E]
    size: [16, 16]
    powerup_types: [2]
  one_up:
    types: [0x2E]
    size: [16, 16]
    powerup_types: [3]

walker:                    # the scripted start_at_x walker (a scene tool, not the fly)
  jump_hold: 28            # frames A stays down per jump
  wall_trigger: 28         # px to a wall that starts a jump
  pit_trigger: 22          # px to a pit that starts a jump
  enemy_trigger: 30
  max_frames: 20000
