# The drives config for E1s (evolution Stage 1 WITH sour smell). E1's own config is kept in drives_e1.yaml (the E1 modules read that one).
# Which drives are ON and which entities they attach to. The genome is BUILT from this file (flyrun/e1s_genome.py): each ON drive contributes its gain gene; the motor thresholds are always in;
# an OFF drive's gain is not in the genome. Perception switches (headroom looming) are on/off here but are never genes.
drives:
  looming:
    enabled: true
    attaches: [goomba, koopa, pipe_face, pit_tower]
    gain: null
    toggles: {enemy_input: true, PIPE_SENSE: true, PIT_SENSE: true}
  home:
    enabled: true
    attaches: []
    gain: HOME_R
    toggles: {HOME_SENSE: true}
  hum:
    enabled: true
    attaches: [reachable_question_block]
    gain: HUM_GAIN
    toggles: {HUM_SENSE: true}
  smell:                                                  # sweet smell
    enabled: true
    attaches: [mushroom]
    gain: SMELL_GAIN
    toggles: {SMELL_SENSE: true}
  sour:
    enabled: true
    attaches: [live_enemies]                              # the nearest live enemy drives the DC4 (acid) ORNs; real wiring DC4 -> ... -> MDN (back up)
    gain: SOUR_GAIN
    toggles: {SOUR_SENSE: true}
perception:                                               # on / off only, never evolved
  headroom_looming:
    enabled: true
    toggles: {HEADROOM_LOOM: true}
motor:
  genes: [TTMN_THRESH, RELEASE_THRESH, STEER_THRESH, MDN_THRESH]
bounds:
  gain_log_factor: [0.25, 4.0]
  threshold_fraction: 0.5
start:                                                    # the start genome: the E1 best (runs/E1_progress.json) plus the AV1 values
  from: E1_best
  extra: {SOUR_GAIN: 8.0587, MDN_THRESH: 0.10}
