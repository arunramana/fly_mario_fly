name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
      # FLY_MARIO_FLY_DATA is deliberately unset: tests that need the 1 GB MaleCNS weights skip, nothing is downloaded.
      - name: Tests
        run: python -m pytest tests -q --timeout=600

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
