name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The three job names below are what branch rules require (Settings -> Rules): python, web, rules. Keep them stable; a test checks.
jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
      # FLY_MARIO_FLY_DATA is deliberately unset: tests that need the 1 GB MaleCNS weights skip, nothing is downloaded.
      - name: Tests
        run: python -m pytest tests -q --timeout=600

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  rules:
    name: rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
      # Every sense, action, object, shape, scene and mechanism must declare its origin (teal = real wiring, orange = invented)
      # and stay inside the project rules. Plain-English errors; see `python -m fly_mario_fly.rules list`.
      - name: Validate every plug-in against the rules
        run: python -m fly_mario_fly.rules validate
