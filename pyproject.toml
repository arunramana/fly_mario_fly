[build-system]
requires = ["setuptools>=61,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "fly_mario_fly"
version = "0.0.1"
description = "Attach MaleCNS fly senses to Super Mario objects; watch, rewind, retry."
requires-python = ">=3.12"
# Same pins as the old repo: nes-py breaks under numpy 2. nes-py 9 / gym-super-mario-bros 9 moved to the gymnasium API
# (step() returns 5 values) and break MarioEnv, so both are held at the last gym-0.23 releases.
# numpy stays <1.27, so pyarrow and pandas are capped to the releases that still support it.
dependencies = ["numpy>=1.26,<1.27", "scipy>=1.11", "pyyaml", "pyarrow<24",
    "fastapi>=0.150,<0.160", "uvicorn", "websockets", "pydantic>=2", "httpx",
    "setuptools<85", "gym==0.23.1", "nes-py==8.2.1", "gym-super-mario-bros==7.4.0", "opencv-python-headless<4.10", "pillow", "cma", "imageio-ffmpeg"]

[project.optional-dependencies]
dev = ["pytest"]
mcp = ["mcp==2.3.0"]            # the MCP server (python -m fly_mario_fly.mcp_server); tests skip without it
test = ["pandas<3", "pytest-timeout"]

[project.scripts]
fly-mario-fly-mcp = "fly_mario_fly.mcp_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
fly_mario_fly = ["fly/groups.yaml", "fly/data/*.yaml", "mario/facts/**/*.yaml", "mario/facts/*.json"]
